backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main

# If you host on Netlify or Cloudflare Pages and would rather skip setting up
# a GitHub OAuth app, swap the block above for:
#
# backend:
#   name: git-gateway
#   branch: main
#
# ...and turn on Netlify Identity + Git Gateway in the site's Netlify settings.
# See README.md for the full walkthrough of both options.

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Site settings"
        file: "src/_data/site.json"
        fields:
          - { name: "name", label: "Company name", widget: "string" }
          - { name: "tagline", label: "Tagline", widget: "string" }
          - { name: "domain", label: "Domain", widget: "string" }
          - { name: "contactEmail", label: "Contact email", widget: "string" }
          - { name: "formEndpoint", label: "Contact form endpoint (Formspree URL)", widget: "string" }
          - name: "divisions"
            label: "Divisions"
            widget: "list"
            fields:
              - { name: "name", label: "Name", widget: "string" }
              - { name: "url", label: "URL", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }

